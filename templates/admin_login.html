<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin</title>
  <link rel="stylesheet" href="/static/style.css?v=20260812-visual-unificado-v5">
</head>
<body class="pagina-admin-login">
    <div class="admin-login-box">
        <h1 class="titulo-login-admin">🔐 Login Admin</h1>
        <form method="post" class="form-admin-login">
            <div class="senha-input-wrap"><input type="password" name="senha" placeholder="Digite a senha do admin" required autocomplete="current-password"><button type="button" class="btn-mostrar-senha" data-toggle-password aria-label="Mostrar senha do administrador" aria-pressed="false"><span aria-hidden="true">👁</span></button></div>
            {% if erro %}<p class="erro-login">{{ erro }}</p>{% endif %}
            <button class="btn-admin-entrar" type="submit">Entrar</button>
        </form>
        {% if redefinir_msg %}<p class="sucesso-login">{{ redefinir_msg }}</p>{% endif %}
        {% if redefinir_erro %}<p class="erro-login">{{ redefinir_erro }}</p>{% endif %}
        <details class="bloco-redefinir-senha">
            <summary>Redefinir senha do admin</summary>
            <form method="post" action="/admin/redefinir-senha" class="form-admin-login redefinir-senha-form">
                <div class="senha-input-wrap"><input type="password" name="senha_atual" placeholder="Senha antiga" required autocomplete="current-password"><button type="button" class="btn-mostrar-senha" data-toggle-password aria-label="Mostrar senha antiga" aria-pressed="false"><span aria-hidden="true">👁</span></button></div>
                <div class="senha-input-wrap"><input type="password" name="nova_senha" placeholder="Nova senha" required autocomplete="new-password"><button type="button" class="btn-mostrar-senha" data-toggle-password aria-label="Mostrar nova senha" aria-pressed="false"><span aria-hidden="true">👁</span></button></div>
                <div class="senha-input-wrap"><input type="password" name="confirmar_senha" placeholder="Confirmar nova senha" required autocomplete="new-password"><button type="button" class="btn-mostrar-senha" data-toggle-password aria-label="Mostrar confirmação da senha" aria-pressed="false"><span aria-hidden="true">👁</span></button></div>
                <button class="btn-admin-entrar" type="submit">Atualizar senha</button>
            </form>
        </details>
        <a href="/" class="btn-admin-voltar-loja btn-voltar-loja-padrao">← Voltar para a loja</a>
    </div>
    <script src="/static/cliente_senha.js?v=20260725-todos-campos"></script>
    {% include "_whatsapp_suporte.html" %}
</body>
</html>
