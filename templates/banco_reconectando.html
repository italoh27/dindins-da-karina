<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="8">
  <title>Reconectando · Geladinhos Gourmet</title>
  <link rel="stylesheet" href="/static/style.css?v=20260814-mobile-checkout-v1">
  <style>
    .reconectando-card{width:min(520px,calc(100% - 32px));margin:12vh auto 0;padding:36px;text-align:center}
    .reconectando-card h1{color:#fff;margin:10px 0}.reconectando-card p{color:#cbd5e1;line-height:1.6}
    .reconectando-loader{width:46px;height:46px;margin:24px auto;border:5px solid rgba(255,255,255,.18);border-top-color:#22d3ee;border-radius:50%;animation:girar .9s linear infinite}
    @keyframes girar{to{transform:rotate(360deg)}}
  </style>
</head>
<body class="pagina-cliente pagina-premium-bg">
  <main class="glass-card reconectando-card">
    <span class="eyebrow-premium">Só um momento</span>
    <h1>Estamos reconectando</h1>
    <div class="reconectando-loader" aria-hidden="true"></div>
    <p>O aplicativo e o banco de dados estão acordando. Esta página tentará novamente automaticamente.</p>
    <a class="btn-vibrante" href="/">Tentar agora</a>
  </main>
  {% include "_whatsapp_suporte.html" %}
</body>
</html>
